spring.application.name=library-producer

server.port=8080

# Remote AWS Kafka cluster (playground-cluster) - kafka-broker-1/2/3
# Setting the common property so it's shared by the producer AND the
# KafkaAdmin (used to auto-create the topic on startup).
spring.kafka.bootstrap-servers=ec2-18-223-60-27.us-east-2.compute.amazonaws.com:9092,ec2-18-223-60-27.us-east-2.compute.amazonaws.com:9093,ec2-18-223-60-27.us-east-2.compute.amazonaws.com:9094
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.IntegerSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

library-events.topic=library-events
library-events.topic.partitions=3
library-events.topic.replicas=3
library-events.topic.min-insync-replicas=2

