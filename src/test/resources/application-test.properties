## Test profile: overrides the remote AWS cluster with the JUnit @EmbeddedKafka
## broker so tests never depend on network access or the shared playground
## cluster. Activated via @ActiveProfiles("test") in tests that need Kafka.
spring.kafka.bootstrap-servers=${spring.embedded.kafka.brokers}

# Single embedded broker -> replication factor / min-insync must be 1.
library-events.topic=library-events-test
library-events.topic.partitions=1
library-events.topic.replicas=1
library-events.topic.min-insync-replicas=1

