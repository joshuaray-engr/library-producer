# NOTE: org.gradle.java.home is intentionally NOT set here. This file is
# committed to git and shared by every machine/CI runner that builds this
# project; hardcoding a machine-specific JDK path (e.g.
# /Users/you/dev/jdk-25) breaks the build everywhere else ("Java home
# supplied is invalid"). Gradle will instead launch using whatever JDK is
# on JAVA_HOME / your shell PATH (CI sets this via actions/setup-java;
# locally, either add JDK 25 to your PATH/JAVA_HOME, or set
# org.gradle.java.home in your PERSONAL, non-tracked
# ~/.gradle/gradle.properties instead of this project file).

# Workaround for an intermittent C2 JIT compiler SIGSEGV crash observed in
# this JDK 25 build (25.0.4.1) that killed the Gradle daemon mid-build
# (hs_err_pid*.log, "Compile::Code_Gen"). Disabling C2 (stopping at the C1
# tier) trades a bit of Gradle daemon throughput for build stability. Remove
# once upgraded to a JDK build where this is fixed.
org.gradle.jvmargs=-XX:TieredStopAtLevel=1
