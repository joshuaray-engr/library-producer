# Workaround for an intermittent C2 JIT compiler SIGSEGV crash observed in
# this JDK 25 build (25.0.4.1) that killed the Gradle daemon mid-build
# (hs_err_pid*.log, "Compile::Code_Gen"). Disabling C2 (stopping at the C1
# tier) trades a bit of Gradle daemon throughput for build stability. Remove
# once upgraded to a JDK build where this is fixed.
org.gradle.jvmargs=-XX:TieredStopAtLevel=1
